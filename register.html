    <link rel="stylesheet" href="../libraries/Font_Awesome/all.min.css">

</head>
<body>
<header>
    <div class="nav">
        <div class="logo">Sweet Cake 🍰</div>
        <nav>

<main class="container">
    <h1>إنشاء حساب</h1>

    <form id="registerForm">
        <label for="name">الاسم</label>
        <input id="name" type="text" required>

        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" required>

        <label for="password">كلمة المرور</label>
        <input id="password" type="password" minlength="6" required>

        <label for="confirm">تأكيد كلمة المرور</label>
        <input id="confirm" type="password" minlength="6" required>

        <button class="btn" type="submit">تسجيل</button>
    </form>
</main>

<footer>
    <p>Sweet Cake 🍰 — حلويات بطعم السعادة</p>
    <p><i class="fa-solid fa-heart"></i> جميع الحقوق محفوظة</p>
</footer>

<div id="toast"></div>
