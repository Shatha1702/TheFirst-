<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sweet Cake</title>
    <link rel="stylesheet" href="../libraries/Bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../libraries/Font_Awesome/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <div class="nav">
        <div class="logo">Sweet Cake 🍰</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات</a>
            <a href="cakes.html">الكيكات</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html">تواصل</a>
            <a href="login.html">دخول</a>
        </nav>
    </div>
</header>

<main class="container">
    <section class="hero">
        <h1>مرحبًا بكِ في Sweet Cake 🍰</h1>
        <p>حلويات طازجة، بسيطة ولذيذة لكل مناسبة.</p>
        <a class="btn" href="products.html">شاهدي منتجاتنا</a>
    </section>

    <section>
        <h2>منتجاتنا المميزة</h2>

        <div class="wow-slider">
            <div class="wow-slide">
                <img src="../images/cake-pink-butterfly.jpg" alt="كيكة وردية بالفراشات">
                <div class="slide-caption">كيكة الفراشات الوردية</div>
            </div>

            <div class="wow-slide">
                <img src="../images/cake-chocolate-drip.jpg" alt="كيكة شوكولاتة">
                <div class="slide-caption">كيكة الشوكولاتة</div>
            </div>

            <div class="wow-slide">
                <img src="../images/pink-cupcake.jpg" alt="كب كيك وردي">
                <div class="slide-caption">كب كيك وردي</div>
            </div>

            <button class="wow-prev" type="button" aria-label="السابق">›</button>
            <button class="wow-next" type="button" aria-label="التالي">‹</button>
        </div>

        <div class="wow-dots">
            <span class="wow-dot" data-slide="0"></span>
            <span class="wow-dot" data-slide="1"></span>
            <span class="wow-dot" data-slide="2"></span>
        </div>
    </section>
</main>

<footer>
    <p>Sweet Cake 🍰 — حلويات بطعم السعادة</p>
    <p><i class="fa-solid fa-heart"></i> جميع الحقوق محفوظة</p>
</footer>

<div id="toast"></div>

<script src="../libraries/Bootstrap/jquery.min.js"></script>
<script src="../libraries/Bootstrap/bootstrap.bundle.min.js"></script>
<script src="../libraries/WowSlider/wowslider.js"></script>
<script src="../libraries/Toast/toast.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
