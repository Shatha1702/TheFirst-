<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sweet Cake</title>
    <link rel="stylesheet" href="../libraries/Bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../libraries/Font_Awesome/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <div class="nav">
        <div class="logo">Sweet Cake 🍰</div>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات</a>
            <a href="cakes.html">الكيكات</a>
            <a href="about.html">من نحن</a>
            <a href="contact.html">تواصل</a>
            <a href="login.html">دخول</a>
        </nav>
    </div>
</header>

<main class="container">
    <h1>منتجاتنا</h1>

    <div class="grid">
        <div class="card">
            <img src="../images/cake-white-butterfly.jpg" alt="كيكة بيضاء بالفراشات">
            <h3>كيكة الفراشات</h3>
            <p class="price">9,000 ريال</p>
            <button class="btn" onclick="openModal('product-modal.html')">التفاصيل</button>
        </div>

        <div class="card">
            <img src="../images/cake-pink-butterfly.jpg" alt="كيكة وردية">
            <h3>كيكة وردية</h3>
            <p class="price">9,500 ريال</p>
            <button class="btn" onclick="openModal('product-modal.html')">التفاصيل</button>
        </div>

        <div class="card">
            <img src="../images/cake-chocolate-drip.jpg" alt="كيكة شوكولاتة">
            <h3>كيكة الشوكولاتة</h3>
            <p class="price">8,000 ريال</p>
            <button class="btn" onclick="openModal('product-modal.html')">التفاصيل</button>
        </div>

        <div class="card">
            <img src="../images/cake-chocolate-cream.jpg" alt="كيكة شوكولاتة بالكريمة">
            <h3>كيكة الشوكولاتة بالكريمة</h3>
            <p class="price">8,500 ريال</p>
            <button class="btn" onclick="openModal('product-modal.html')">التفاصيل</button>
        </div>

        <div class="card">
            <img src="../images/pink-cupcake.jpg" alt="كب كيك وردي">
            <h3>كب كيك وردي</h3>
            <p class="price">5,000 ريال</p>
            <button class="btn" onclick="openModal('product-modal.html')">التفاصيل</button>
        </div>
    </div>

    <div id="modalBox" class="modal-box">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <div id="modalBody"></div>
        </div>
    </div>
</main>

<footer>
    <p>Sweet Cake 🍰 — حلويات بطعم السعادة</p>
    <p><i class="fa-solid fa-heart"></i> جميع الحقوق محفوظة</p>
</footer>

<div id="toast"></div>

<script src="../libraries/Bootstrap/jquery.min.js"></script>
<script src="../libraries/Bootstrap/bootstrap.bundle.min.js"></script>
<script src="../libraries/WowSlider/wowslider.js"></script>
<script src="../libraries/Toast/toast.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
