<header>
    <div class="nav">

<main class="container">
    <h1>تواصل معنا</h1>

    <section class="card contact-card">
        <p><i class="fa-solid fa-location-dot"></i> صنعاء - اليمن</p>
        <p><i class="fa-solid fa-phone"></i> 777000000</p>
        <p><i class="fa-solid fa-envelope"></i> sweetcake@example.com</p>
    </section>

    <form id="contactForm">
        <label for="contactName">الاسم</label>
        <input id="contactName" type="text" required>

        <label for="contactEmail">البريد الإلكتروني</label>
        <input id="contactEmail" type="email" required>

        <label for="message">الرسالة</label>
        <textarea id="message" required></textarea>

        <button class="btn" type="submit">إرسال</button>
    </form>
</main>

<footer>
    <p>Sweet Cake 🍰 — حلويات بطعم السعادة</p>
    <p><i class="fa-solid fa-heart"></i> جميع الحقوق محفوظة</p>
